[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "master-thesis-3d-vla"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    # VGGT deps
    # Keep PyTorch on CUDA 12; 2.12 wheels pull CUDA 13 libs that conflict with JAX CUDA 12.
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy>=1.26",
    "Pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    # Habitat — see [project.optional-dependencies] habitat extra
    # Install with: uv sync --extra habitat
    # notebook
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "plotly>=6.5.2",
    "nbformat>=5.10.4",
    # ALFRED / AI2-THOR
    "ai2thor>=5.0.0",
    # data
    "h5py",
    "tqdm",
    # tracking
    "wandb",
    "moviepy",
    # DreamerV3 / JAX
    # CUDA wheels are Linux-only; macOS resolves the plain CPU build.
    "jax==0.6.2; python_version < '3.11'",
    "jax==0.10.2; python_version >= '3.11'",
    "jax[cuda12]==0.6.2; python_version < '3.11' and sys_platform == 'linux'",
    "jax[cuda12]==0.10.2; python_version >= '3.11' and sys_platform == 'linux'",
    "flax>=0.10",
    "optax>=0.2",
    "pydantic>=2",
    "ruamel.yaml",
    "gym>=0.22",
    "tensorboard",
    # Habitat
    # Built from source; the CMake build only succeeds on the Linux cluster.
    "habitat-sim @ git+https://github.com/facebookresearch/habitat-sim.git@main ; sys_platform == 'linux'",
    "habitat-lab @ git+https://github.com/facebookresearch/habitat-lab.git@main#subdirectory=habitat-lab ; sys_platform == 'linux'",
    # dev
    "pytest",
    "pylint",
    "pandas>=2.3.3",
    "transformers>=5.3.0",
    "pyvista>=0.47.1",
    "open3d>=0.19.0",
    "jaxkd>=0.1.2",
    "jaxkd[cuda]>=0.1.2; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
]
markers = [
    "gpu: tests that require GPU (real VGGT model loading)",
    "habitat_sim: tests that instantiate Habitat-Sim environments",
    "integration: tests that exercise external simulators or datasets",
]

[tool.pylint.main]
py-version = "3.12"
jobs = 0
init-hook = '''
import sys
from pathlib import Path
root = Path(".").resolve()
for candidate in (
    root / "external" / "r2dreamer",
    root / "external" / "InfiniteVGGT" / "src",
):
    if candidate.is_dir():
        path = str(candidate)
        if path not in sys.path:
            sys.path.insert(0, path)
'''

[tool.pylint.imports]
ignored-modules = [
    "crafter",
    "habitat",
    "habitat_sim",
    "habitat.tasks.nav.shortest_path_follower",
    "omegaconf",
    "streamvggt",
]

[tool.pylint.typecheck]
extension-pkg-allow-list = ["jax", "jaxlib"]

[tool.uv]
python-preference = "only-managed"
override-dependencies = [
    "numpy>=2.0",
    # opencv-python 5.0.0 changed cv2.applyColorMap's output shape for a 1D
    # input from (N, 1, 3) to (1, N, 3), which breaks habitat 0.3.3's
    # habitat/utils/visualizations/maps.py:44 `.squeeze(1)` (raises "cannot
    # select an axis to squeeze out which has size not equal to one"). Pin
    # below 5 until habitat-lab fixes the squeeze for the new cv2 shape.
    "opencv-python<5",
]

[tool.pylint]
ignore-paths = [
    "^scripts/",
    "^tests/",
    "^external/",
]
