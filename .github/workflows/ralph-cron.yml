name: Ralph Cron Trigger

# Polls every 15 minutes for open issues labelled both `ready` and `AFK`.
# When any exist (and Ralph isn't already running/queued), dispatches `ralph.yml`
# with `max_tasks` equal to the count (capped at 5). This is the trigger glue
# that makes "label issue from phone, wake up to a PR" work.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  maybe-dispatch-ralph:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      actions: write
    steps:
      - name: Dispatch Ralph if ready+AFK issues exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Skip if Ralph is already running or queued. Avoids double-execution.
          IN_PROGRESS=$(gh run list -R "$REPO" -w ralph.yml \
            --status in_progress --json databaseId --jq 'length')
          QUEUED=$(gh run list -R "$REPO" -w ralph.yml \
            --status queued --json databaseId --jq 'length')
          if [ "$IN_PROGRESS" -gt 0 ] || [ "$QUEUED" -gt 0 ]; then
            echo "Ralph busy (in_progress=$IN_PROGRESS queued=$QUEUED); skip."
            exit 0
          fi

          COUNT=$(gh issue list -R "$REPO" \
            --label ready --label AFK --state open \
            --json number --jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "No ready+AFK issues; nothing to dispatch."
            exit 0
          fi

          if [ "$COUNT" -gt 5 ]; then COUNT=5; fi

          echo "Dispatching ralph.yml with max_tasks=$COUNT"
          gh workflow run ralph.yml -R "$REPO" \
            -f max_tasks="$COUNT" -f time_limit=120
