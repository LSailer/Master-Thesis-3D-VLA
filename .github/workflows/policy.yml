name: Policy

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SEMGREP_SEND_METRICS: "off"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Require Semgrep App token
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "::error::SEMGREP_APP_TOKEN is required for the policy scan."
            echo "Create a repository secret named SEMGREP_APP_TOKEN before requiring this check."
            exit 1
          fi

      - name: Run Semgrep policy
        run: bash scripts/check_policy.sh
