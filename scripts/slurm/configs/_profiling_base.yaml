# Shared Slurm defaults for standalone profiling scripts.
# These jobs are not experiment training variants and do not use run_id.
python: .venv/bin/python
arg_style: underscore
strict_bash: true
sbatch:
  partition: gpu_h100_il,gpu_h100
  gres: gpu:1
  ntasks: 1
  cpus_per_task: 8
  mem: 64G
  time: "01:00:00"
env:
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_MEM_FRACTION: "0.7"
setup:
  - ./scripts/setup_worktree.sh
  - bash scripts/slurm/hooks/link_external.sh
  - mkdir -p output/profiling
smoke:
  partition: gpu_h100_short
  time: "00:20:00"
