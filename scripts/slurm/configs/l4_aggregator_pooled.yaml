extends: aggregator_pooled_l1
job_name: r2d-L4-agg-pooled
output_dir: output/runs/r2dreamer-curriculum-l4-aggregator-pooled
run_id: habitat-l4-aggregator-pooled
curriculum_check: data/curriculum/level4_10houses_6goals.json
comments:
  - "L4 rung of the pooled-token arm: 10 houses x 6 goal categories. Identical to aggregator_pooled_l1 except for the curriculum."
  - "L4 superimposes the goal axis (L2) and the scene axis (L3), so it isolates neither; it is the combined-difficulty endpoint of the ladder."
args:
  output_dir: output/runs/r2dreamer-curriculum-l4-aggregator-pooled/run-${SLURM_JOB_ID}
  wandb_name: l4_aggregator_pooled-s${SEED}-${SLURM_JOB_ID}
  wandb_tags: curriculum,level4,10houses,6goals,vggt,aggregator-pooled,pool-on-device,skip-heads,jax,3d-encoder
smoke:
  args:
    output_dir: output/smoke/l4-aggregator-pooled-${TIMESTAMP}
    wandb_name: l4-aggregator-pooled-smoke-${TIMESTAMP}
    wandb_tags: aggregator-pooled,skip-heads,level4,smoke
