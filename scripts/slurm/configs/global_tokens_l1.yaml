extends: _base
job_name: rgb-global-tokens-l1
output_dir: output/runs/r2dreamer-curriculum-l1-rgb-global-tokens
run_id: habitat-l1-vggt-house-global-tokens-nogate
curriculum_check: data/curriculum/level1_1house_1goal.json
setup:
  - scripts/slurm/hooks/link_external.sh
comments:
  - "L1 global-token context (3D-90): replay stores RGB_64 plus the 1374x1024 global half of the final aggregator tokens; the agent runs CNN(image) + Transformer(tokens) and concatenates. VGGT point/camera heads are off."
  - "buffer_capacity is capped deliberately: a token row is 2.8 MB, and the replay buffer preallocates capacity rows."
args:
  steps: 2000000
  prefill: 5000
  buffer_capacity: 20000
  checkpoint_every: 100000
  output_dir: output/runs/r2dreamer-curriculum-l1-rgb-global-tokens/run-${SLURM_JOB_ID}
  seed: ${SLURM_JOB_ID}
  log_every: 250
  wandb_project: 3d-vla-objectnav
  wandb_name: l1_rgb_global_tokens-${SLURM_JOB_ID}
  wandb_tags: curriculum,level1,1house,chair-only,vggt,global-token-transformer,no-gate,rgb-replay,live-cache,bounded-cache,3d-90,jax,3d-encoder
  render_resolution: 518
  video_log_every: 0
  val_every: 0
smoke:
  time: "00:20:00"
  args:
    steps: 800
    prefill: 200
    batch_size: 4
    seq_len: 16
    train_ratio: 16
    buffer_capacity: 1000
    log_every: 50
    checkpoint_every: 10000
    output_dir: output/smoke/rgb-global-tokens-${TIMESTAMP}
    wandb_name: rgb-global-tokens-smoke-${TIMESTAMP}
    wandb_tags: global-token-transformer,smoke,no-gate,rgb-replay,live-cache
