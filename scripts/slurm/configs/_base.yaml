# Every variant launches the one entry point; each leaf names its arm with the
# ordinary adapter:/curriculum: flags in its own args: block.
script: -m src.main
sbatch:
  # Auto-select the faster queue: SLURM schedules on whichever partition can
  # run the job soonest. Both are the same H100 hardware (identical speed) with
  # PreemptMode=OFF; they share PriorityTier, so list order breaks ties: keep
  # gpu_h100_il first to bias toward the (currently less-contended) il pool,
  # with gpu_h100 as fallback. il MaxTime is 2 days, so keep prod time <= 48h.
  partition: gpu_h100_il,gpu_h100
  gres: gpu:1
  ntasks: 1
  cpus_per_task: 8
  mem: 64G
  time: "48:00:00"
env:
  # Hard-exit a completed habitat run before habitat_sim's GL teardown
  # SIGABRTs ("no current context") and poisons the exit code, handled in
  # Trainer.run() via the hard_exit_on_finish flag (read from this var).
  # Defined here so every _base-derived variant inherits it, keeping the
  # CNN and VGGT arms symmetric under the smoke-then-prod afterok gate.
  R2DREAMER_HARD_EXIT_ON_FINISH: "1"
  # Reproducible, arm-paired training seed. Curriculum configs write
  # `seed: ${SEED}` instead of the old `seed: ${SLURM_JOB_ID}`, which was
  # unknown before submit and differed per arm - so the 2D and 3D arms saw
  # different episode orders and no run could be reproduced. Override per
  # submission with `launch.sh <variant> --env SEED=2`; the same value pins
  # every arm of one comparison. The seed reaches habitat's episode ordering
  # (src/environments/habitat.py), so this is what makes arms paired.
  SEED: "43"
args:
  # Every config here is a habitat arm; crafter is an ad-hoc CLI run only.
  env: habitat
  # Shared training-step budget for the curriculum family. The CNN and VGGT
  # arms share the same 2M budget for a fair comparison; variants may override.
  steps: 2000000
smoke:
  partition: gpu_h100_short
  time: "00:30:00"
  assert_file: metrics.csv
  assert_min_rows: 5
  args:
    steps: 1500
    # Must stay >= batch_size * seq_len (16 * 64 = 1024), the replay gate in
    # train_loop. Below that the gate opens mid-run instead of at step 0, which
    # shifts the parity of the gradient-update steps and puts the smoke in a
    # different regime than prod (which prefills 5000). That divergence is what
    # let the train-metric logging bug reach production unseen: the smoke's
    # updates happened to land on the log_every steps, so it logged metrics
    # while every prod run silently logged none. 2048 = 2x the gate, so the
    # smoke keeps matching prod if batch_size or seq_len grow moderately.
    prefill: 2048
    checkpoint_every: 1000000
    seed: 43
    log_every: 50
    # All smoke runs log to a dedicated W&B project, kept separate from the
    # prod 3d-vla-objectnav project. Inherited by every config that `extends:
    # _base` and overrides the prod `wandb_project` for smoke mode. (Jobs run
    # WANDB_MODE=offline on the firewalled compute node; sync from the login
    # node: `wandb sync <output_dir>/wandb/offline-run-*`.)
    wandb_project: 3d-vla-objectnav-smoke
