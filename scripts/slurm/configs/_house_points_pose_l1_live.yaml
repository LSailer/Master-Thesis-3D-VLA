extends: house_context_l1
job_name: vggt-house-points-pose-l1-live
output_dir: output/runs/r2dreamer-curriculum-l1-vggt-house-points-pose-live
setup:
  - scripts/slurm/hooks/link_external.sh
comments:
  - "ABSTRACT PARENT - the leading underscore marks it as a shared base, not a launchable variant: it declares no adapter of its own, so submitting it would train whatever house_context_l1 declares under this job name. Its own arm (the map-as-replacement `habitat-l1-vggt-house-points-pose` run) was dropped in the adapter-routing migration; the shared sbatch/smoke shape below is still the base of gnn_house_points_pose_l1_live and hybrid_house_points_pose_l1_live, which name their own adapter."
  - "L1 LIVE per-scene house-points buffer (no static PLY sidecar): VGGT world points accumulate into a per-scene voxel buffer that persists across episodes of one house."
  - "ResetMode.PERSIST_SCENE (EXTRACTOR_KWARGS on the house_voxels adapters) keeps every episode of one house in a single VGGT world frame, so the buffer builds one coherent map instead of ghost copies (fixes the 3.4M-points-in-1200-steps misalignment of job 5706115)."
  - "Replay stores only the current camera_pose; the house cloud is the adapter's single buffer=False live field, emitted at a fixed (N,6) XYZRGB size so the branch does not recompile as the buffer grows. The trainer logs the per-scene buffer growth curve (house_buffer/points_growth) - the go/no-go for PERSIST is that it saturates rather than climbs linearly."
  - "Default house branch is classic PointNet (PointNetCloudEncoder in src/r2dreamer/encoders/pointnet.py): even-stride subsample to 16384 points, input/feature T-Nets, shared MLPs (64,64)/(64,128,1024), max pool to one 1024-d global feature."
args:
  output_dir: output/runs/r2dreamer-curriculum-l1-vggt-house-points-pose-live/run-${SLURM_JOB_ID}
  wandb_name: l1_live_house_points_pose-${SLURM_JOB_ID}
  wandb_tags: curriculum,level1,1house,chair-only,vggt,house-points,live-buffer,camera-pose-replay,pointnet,tnet,persist-scene,jax,3d-encoder
smoke:
  time: "00:30:00"
  args:
    # 1000 prefill + 2000 train = 3000 env steps -> ~20 min wall on H100 (the
    # 600+600 smoke ran in ~8 min, ~0.4 s/step incl. compile). Longer smoke to
    # exercise more episodes + deeper training within the 30-min gpu_h100_short
    # cap (margin). Inspect house_buffer/points_growth in metrics.csv: under
    # the fix it should stay well below the 3.4M FULL baseline (job 5706115,
    # 1200 steps) and not accelerate across the prefill->train boundary.
    steps: 2000
    prefill: 1000
    batch_size: 4
    seq_len: 16
    train_ratio: 16
    log_every: 50
    checkpoint_every: 1000000
    output_dir: output/smoke/vggt-house-points-pose-live-${TIMESTAMP}
    wandb_name: vggt-house-points-pose-live-smoke-${TIMESTAMP}
    wandb_tags: house-points,live-buffer,smoke,camera-pose-replay,pointnet,tnet,persist-scene