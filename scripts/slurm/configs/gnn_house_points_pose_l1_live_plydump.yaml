extends: gnn_house_points_pose_l1_live
job_name: gnn-house-points-pose-l1-live-plydump
output_dir: output/runs/r2dreamer-curriculum-l1-gnn-house-points-pose-plydump
comments:
  - "Same GNN house-points-pose run as the parent, plus accumulated house-context PLY dumps at 500k/1M/1.5M/2M adapter steps (one per observed env frame, reset frames included) and at the end of the first episode. Dumps land in <output_dir>/pointcloud_dumps/{step_000500000,...,end_of_first_episode}/<scene>/step_00000_context.ply. Diagnostics only: buffer.save() adds an occasional host sync but does not touch training."
args:
  adapter: rgb_house_voxels_gnn
  curriculum: L1
  output_dir: output/runs/r2dreamer-curriculum-l1-gnn-house-points-pose-plydump/run-${SLURM_JOB_ID}
  wandb_name: l1_gnn_house_points_pose_plydump-${SLURM_JOB_ID}
  # Comma-separated milestones (launcher args must be scalars, so this is a
  # quoted string, not a YAML list). Claimed by the house_voxels adapter via
  # RUN_FLAGS and parsed there; the run directory decides where they land.
  pointcloud_dump_steps: "500000,1000000,1500000,2000000"
smoke:
  time: "00:30:00"
  args:
    steps: 4500
    output_dir: output/smoke/gnn-house-points-pose-live-plydump-${TIMESTAMP}
    wandb_name: gnn-house-points-pose-live-plydump-smoke-${TIMESTAMP}
    # Smoke: dump at steps the short run actually reaches (1000 prefill + 4500
    # train frames), plus the first-episode snapshot.
    pointcloud_dump_steps: "2000,4000"
