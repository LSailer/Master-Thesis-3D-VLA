extends: _base
job_name: aggregator-pooled-l1
output_dir: output/runs/r2dreamer-curriculum-l1-aggregator-pooled
run_id: habitat-l1-aggregator-pooled
curriculum_check: data/curriculum/level1_1house_1goal.json
setup:
  - scripts/slurm/hooks/link_external.sh
comments:
  - "L1 pooled-token arm: the global half of the aggregator tokens reduced to [camera token, patch mean, patch max] = 3072 float32 and routed to an MLP branch. Register tokens are dropped. No appearance channel and no geometry, so no decoder target."
  - "The cheap end of the token family: 12 KB/step against global_tokens_l1's 2.8 MB, so it needs no buffer_capacity cap. It bounds how much of the sequence arms' behaviour a plain pooled readout already explains."
  - "VGGT point/camera heads are off (EXTRACTOR_KWARGS on the adapter): this arm reads aggregator tokens only."
args:
  steps: 2000000
  prefill: 5000
  checkpoint_every: 100000
  output_dir: output/runs/r2dreamer-curriculum-l1-aggregator-pooled/run-${SLURM_JOB_ID}
  seed: ${SLURM_JOB_ID}
  log_every: 250
  wandb_project: 3d-vla-objectnav
  wandb_name: l1_aggregator_pooled-${SLURM_JOB_ID}
  wandb_tags: curriculum,level1,1house,chair-only,vggt,aggregator-pooled,pool-on-device,skip-heads,jax,3d-encoder
  render_resolution: 518
  video_log_every: 0
  val_every: 0
smoke:
  time: "00:20:00"
  args:
    steps: 800
    prefill: 200
    batch_size: 4
    seq_len: 16
    train_ratio: 16
    log_every: 50
    checkpoint_every: 10000
    output_dir: output/smoke/aggregator-pooled-${TIMESTAMP}
    wandb_name: aggregator-pooled-smoke-${TIMESTAMP}
    wandb_tags: aggregator-pooled,skip-heads,smoke
