extends: _base
job_name: vggt-house-context-l1
output_dir: output/runs/r2dreamer-curriculum-l1-vggt-house-context
run_id: habitat-l1-vggt-house-context
curriculum_check: data/curriculum/level1_1house_1goal.json
setup:
  - scripts/slurm/hooks/link_external.sh
comments:
  - "L1 house-context claim: replay stores RGB_64 only; live bounded InfiniteVGGT cache supplies current house-level WP/CP context at act/train time"
  - "Tests whether persistent 3D scene memory helps learning, not merely whether per-step 3D replay storage is smaller"
args:
  steps: 2000000
  prefill: 5000
  checkpoint_every: 100000
  output_dir: output/runs/r2dreamer-curriculum-l1-vggt-house-context/run-${SLURM_JOB_ID}
  seed: ${SLURM_JOB_ID}
  log_every: 250
  wandb_project: 3d-vla-objectnav
  wandb_name: l1_rgb_replay_vggt_house_context-${SLURM_JOB_ID}
  wandb_tags: curriculum,level1,1house,chair-only,vggt,house-context,rgb-replay,live-cache,bounded-cache,3d-77,jax,3d-encoder
  render_resolution: 518
  video_log_every: 0
  val_every: 0
smoke:
  time: "00:20:00"
  args:
    steps: 800
    prefill: 200
    batch_size: 4
    seq_len: 16
    train_ratio: 16
    log_every: 50
    checkpoint_every: 10000
    output_dir: output/smoke/vggt-house-context-${TIMESTAMP}
    wandb_name: vggt-house-context-smoke-${TIMESTAMP}
    wandb_tags: house-context,smoke,rgb-replay,live-cache
