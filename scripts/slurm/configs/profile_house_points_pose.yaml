extends: _profiling_base
job_name: profile-house-points-pose
output_dir: output/profiling/house-points-pose
script: scripts/profiling/profile_house_points_pose.py
curriculum_check: data/curriculum/level1_1house_1goal.json
env:
  WANDB_MODE: offline
comments:
  - "Phase-timing profile of the REAL house-points-pose train loop at production shape (batch 16, seq 64, ratio 512) — attributes the ~213-230 ms/step seen in compare jobs 5736907/5736908 to agent_act / env_step / vggt_extract / house_add / house_snapshot / train_step."
  - "Instruments via Trainer.run monkeypatch (see script docstring), so the loop under test is byte-identical to production; prefill_steps must stay >= batch*seq (1024 frames) so train_step fires from the first acting step."
args:
  run_id: habitat-l1-gnn-house-points-pose
  prefill_steps: 1300
  acting_steps: 400
  batch_size: 16
  seq_len: 64
  train_ratio: 512
  output_dir: output/profiling/house-points-pose/run-${SLURM_JOB_ID}
smoke:
  args:
    prefill_steps: 1100
    acting_steps: 150
    output_dir: output/profiling/house-points-pose/smoke-${TIMESTAMP}
