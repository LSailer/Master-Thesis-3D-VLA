extends: l1_vggt
job_name: r2d-L2-vggt
output_dir: output/r2dreamer-curriculum-l2-vggt
run_id: habitat-l2-vggt
curriculum_check: data/curriculum/level2_1house_6goals.json
comments:
  - "Level 2 with VGGT 3D encoder: 1 house (fK2vEV32Lag), 6 goal categories"
args:
  output_dir: output/r2dreamer-curriculum-l2-vggt/run-${SLURM_JOB_ID}
  wandb_name: r2d-L2-vggt-flatten-${SLURM_JOB_ID}
  wandb_tags: curriculum,level2,1house,6goals,vggt,jax,3d-encoder,flatten,wp-cp
  # Flatten / bare-linear WP+CP readout (vggt_mlp_layers=0), matching the L1
  # flatten reference vggt_jax-4216462. The current default is 1 (shallow MLP),
  # so this MUST be set explicitly or the cross-level comparison is confounded.
  mlp_layers: 0
  # In-run validation/video flags are not exposed by the train parser.
  # Held-out eval metrics and videos are regenerated from checkpoints.
