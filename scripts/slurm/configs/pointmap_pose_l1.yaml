extends: _base
job_name: pointmap-pose-l1
output_dir: output/runs/r2dreamer-curriculum-l1-pointmap-pose
curriculum_check: data/curriculum/level1_1house_1goal.json
setup:
  - scripts/slurm/hooks/link_external.sh
comments:
  - "L1 geometry-only arm (3D-52): replay stores one vector per step - the 37x37 pooled VGGT point map flattened plus the camera pose (4116 float32) - routed to an MLP branch. No RGB field at all, so this arm is blind to appearance and the decoder probe is unavailable for it."
  - "Paired with habitat-l1-hybrid (adapter rgb_pointmap_pose), which is the same pipeline plus the image field; the pair isolates what appearance contributes."
  - "The MLP branch runs at the routed encoder's default depth. --mlp_layers still reaches it (the adapter-routing migration rewired the flag onto the MLP branch); it is simply not swept here."
args:
  adapter: pointmap_pose
  curriculum: L1
  # Ladder budget, shared by all five arms. Known not to be reachable here: at
  # the 106-121 ms/step measured on rx29922r / 7ty9rj26 this arm covers roughly
  # 1.3-1.4M of it before the 48 h wall (the partition maximum), i.e. ~90%.
  # Recorded rather than silently lowered, so the truncation is a disclosed
  # limit of the comparison instead of an unexplained gap in the curve.
  steps: 1500000
  prefill: 5000
  checkpoint_every: 100000
  output_dir: output/runs/r2dreamer-curriculum-l1-pointmap-pose/run-${SLURM_JOB_ID}
  seed: ${SEED}
  log_every: 250
  # Pinned rather than inherited from the 500k code default, so every rung of
  # this arm replays the same capacity even if the default moves. A row is
  # 4116 float32 = 16.5 KB, so 500k rows are ~8 GB of the node's 64 GB.
  buffer_capacity: 500000
  wandb_project: 3d-vla-objectnav
  wandb_name: l1_pointmap_pose-${SLURM_JOB_ID}
  wandb_tags: curriculum,level1,1house,chair-only,vggt,pointmap-pose,geometry-only,3d-52,jax,3d-encoder
  render_resolution: 518
  video_log_every: 0
smoke:
  time: "00:20:00"
  args:
    steps: 800
    prefill: 200
    batch_size: 4
    seq_len: 16
    train_ratio: 16
    log_every: 50
    checkpoint_every: 10000
    output_dir: output/smoke/pointmap-pose-${TIMESTAMP}
    wandb_name: pointmap-pose-smoke-${TIMESTAMP}
    wandb_tags: pointmap-pose,geometry-only,smoke
