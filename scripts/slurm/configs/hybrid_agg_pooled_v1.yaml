extends: _base
job_name: hybrid-agg-pooled-v1
output_dir: output/runs/r2dreamer-curriculum-l1-hybrid-agg-pooled
run_id: habitat-l1-hybrid-agg-pooled
curriculum_check: data/curriculum/level1_1house_1goal.json
strict_bash: true
comments:
  - "3D-56 hybrid pooled aggregator: CNN(RGB64) + zero-gated MLP3([camera|mean|max])"
  - "VGGT heads skipped; logs hybrid/{gate,cnn_frac,vggt_frac,cnn_l2,vggt_l2}"
args:
  steps: 2000000
  prefill: 5000
  checkpoint_every: 100000
  mlp_vggt_layers: 3
  output_dir: output/runs/r2dreamer-curriculum-l1-hybrid-agg-pooled/run-${SLURM_JOB_ID}
  seed: ${SLURM_JOB_ID}
  log_every: 250
  wandb_project: 3d-vla-objectnav
  wandb_name: hybrid-agg-pooled-${SLURM_JOB_ID}
  wandb_tags: curriculum,level1,1house,chair-only,hybrid,cnn,aggregator-pooled,camera-mean-max,mlp-3layer,3d-56,jax
  render_resolution: 518
smoke:
  time: "00:20:00"
  args:
    steps: 800
    prefill: 200
    batch_size: 4
    seq_len: 16
    train_ratio: 16
    log_every: 50
    checkpoint_every: 10000
    output_dir: output/smoke/hybrid-agg-pooled-${TIMESTAMP}
    wandb_name: hybrid-agg-pooled-smoke-${TIMESTAMP}
    wandb_tags: hybrid-agg-pooled,smoke,3d-56
