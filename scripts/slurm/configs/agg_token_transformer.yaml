extends: _base
job_name: agg-token-tf
output_dir: output/prod
run_id: habitat-l1-vggt-agg-token-transformer
strict_bash: true
comments:
  - "3D-75 full VGGT aggregator-token Transformer; run smoke/profile before prod"

sbatch:
  time: "42:00:00"

args:
  steps: 2000000
  prefill: 5000
  seed: 42
  log_every: 1000
  checkpoint_every: 50000
  output_dir: output/prod/agg-token-transformer-${TIMESTAMP}
  wandb_name: agg-token-transformer-${TIMESTAMP}
  wandb_tags: agg-token-transformer,full-aggregator-tokens,3d-75,prod-42h

smoke:
  time: "00:20:00"
  args:
    steps: 200
    prefill: 64
    checkpoint_every: 10000
    output_dir: output/smoke/agg-token-transformer-${TIMESTAMP}
    wandb_name: agg-token-transformer-smoke-${TIMESTAMP}
    wandb_tags: agg-token-transformer-smoke,smoke,3d-75
