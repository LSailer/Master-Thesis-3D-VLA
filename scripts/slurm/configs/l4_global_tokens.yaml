extends: global_tokens_l1
job_name: r2d-L4-global-tokens
output_dir: output/runs/r2dreamer-curriculum-l4-global-tokens
curriculum_check: data/curriculum/level4_10houses_6goals.json
comments:
  - "L4 rung of the hybrid CNN + token arm: 10 houses x 6 goal categories. Identical to global_tokens_l1 except for the curriculum, including the 20000-row buffer cap that a 2.8 MB token row forces."
  - "L4 superimposes the goal axis (L2) and the scene axis (L3), so it isolates neither; it is the combined-difficulty endpoint of the ladder."
args:
  adapter: rgb_global_tokens
  curriculum: L4
  output_dir: output/runs/r2dreamer-curriculum-l4-global-tokens/run-${SLURM_JOB_ID}
  wandb_name: l4_global_tokens-s${SEED}-${SLURM_JOB_ID}
  wandb_tags: curriculum,level4,10houses,6goals,vggt,global-token-transformer,no-gate,rgb-replay,live-cache,bounded-cache,3d-90,jax,3d-encoder
smoke:
  args:
    output_dir: output/smoke/l4-global-tokens-${TIMESTAMP}
    wandb_name: l4-global-tokens-smoke-${TIMESTAMP}
    wandb_tags: global-token-transformer,level4,smoke,no-gate,rgb-replay,live-cache
