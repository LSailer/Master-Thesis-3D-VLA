comments:
  - "Classic PointNet house branch (src/r2dreamer/encoders/pointnet.py): even-stride subsample to 16384 points, input T-Net (3x3) -> shared MLP (64,64) -> feature T-Net (64x64) -> shared MLP (64,128,1024) -> max pool to one 1024-d global feature (Qi et al., arXiv:1612.00593; RMSNorm+SiLU instead of BatchNorm+ReLU)."
