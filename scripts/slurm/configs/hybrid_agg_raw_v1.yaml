extends: _base
job_name: hybrid-agg-raw-v1
output_dir: output/runs/r2dreamer-curriculum-l1-hybrid-agg-raw
run_id: habitat-l1-hybrid-agg-raw
curriculum_check: data/curriculum/level1_1house_1goal.json
strict_bash: true
comments:
  - "3D-56 hybrid raw aggregator: CNN(RGB64) + zero-gated MLP3(raw ~1.4M aggregator)"
  - "VGGT heads skipped; raw replay stored float16 with small buffer/batch from encoder overrides"
sbatch:
  mem: 128G
args:
  steps: 2000000
  prefill: 5000
  checkpoint_every: 100000
  mlp_vggt_layers: 3
  output_dir: output/runs/r2dreamer-curriculum-l1-hybrid-agg-raw/run-${SLURM_JOB_ID}
  seed: ${SLURM_JOB_ID}
  log_every: 250
  wandb_project: 3d-vla-objectnav
  wandb_name: hybrid-agg-raw-${SLURM_JOB_ID}
  wandb_tags: curriculum,level1,1house,chair-only,hybrid,cnn,aggregator-raw,mlp-3layer,3d-56,jax
  render_resolution: 518
smoke:
  time: "00:30:00"
  args:
    steps: 250
    prefill: 64
    batch_size: 1
    seq_len: 8
    train_ratio: 4
    log_every: 25
    checkpoint_every: 10000
    output_dir: output/smoke/hybrid-agg-raw-${TIMESTAMP}
    wandb_name: hybrid-agg-raw-smoke-${TIMESTAMP}
    wandb_tags: hybrid-agg-raw,smoke,3d-56
