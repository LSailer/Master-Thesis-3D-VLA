extends: house_context_l1
job_name: vggt-house-points-pose-l1
output_dir: output/runs/r2dreamer-curriculum-l1-vggt-house-points-pose
run_id: habitat-l1-vggt-house-points-pose
setup:
  - scripts/slurm/hooks/link_external.sh
  - ': "${HOUSE_POINTS_PATH:?Set HOUSE_POINTS_PATH to the static XYZRGB PLY file}"'
  - 'test -f "${HOUSE_POINTS_PATH}"'
comments:
  - "L1 static house-points prototype: replay stores only current camera_pose; train batches attach one complete XYZRGB house point cloud as a sidecar"
args:
  output_dir: output/runs/r2dreamer-curriculum-l1-vggt-house-points-pose/run-${SLURM_JOB_ID}
  wandb_name: l1_static_house_points_pose-${SLURM_JOB_ID}
  wandb_tags: curriculum,level1,1house,chair-only,vggt,house-points,static-sidecar,camera-pose-replay,point-mlp,jax,3d-encoder
  static_house_points_path: ${HOUSE_POINTS_PATH}
smoke:
  time: "00:30:00"
  args:
    steps: 800
    prefill: 200
    batch_size: 4
    seq_len: 16
    train_ratio: 16
    log_every: 50
    checkpoint_every: 10000
    output_dir: output/smoke/vggt-house-points-pose-${TIMESTAMP}
    wandb_name: vggt-house-points-pose-smoke-${TIMESTAMP}
    wandb_tags: house-points,smoke,static-sidecar,camera-pose-replay,point-mlp
