extends: l1_vggt
job_name: r2d-L3-vggt
output_dir: output/r2dreamer-curriculum-l3-vggt
run_id: habitat-l3-vggt
curriculum_check: data/curriculum/level3_10houses_1goal.json
comments:
  - "Level 3 with VGGT 3D encoder: 10 houses, chair only"
args:
  output_dir: output/r2dreamer-curriculum-l3-vggt/run-${SLURM_JOB_ID}
  wandb_name: r2d-L3-vggt-flatten-${SLURM_JOB_ID}
  wandb_tags: curriculum,level3,10houses,chair-only,vggt,jax,3d-encoder,flatten,wp-cp
  # Flatten / bare-linear WP+CP readout (vggt_mlp_layers=0), matching the L1
  # flatten reference vggt_jax-4216462. The current default is 1 (shallow MLP),
  # so this MUST be set explicitly or the cross-level comparison is confounded.
  mlp_layers: 0
  # Scalars-only: video_log_every=0 / val_every=0 inherited from l1_vggt.
  # (Dropped the stale val_data / val_loss_every flags — the parser no longer
  # accepts them; in-run eval is off and regenerated from checkpoints instead.)
