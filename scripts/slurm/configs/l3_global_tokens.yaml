extends: global_tokens_l1
job_name: r2d-L3-global-tokens
output_dir: output/runs/r2dreamer-curriculum-l3-global-tokens
curriculum_check: data/curriculum/level3_10houses_1goal.json
comments:
  - "L3 rung of the hybrid CNN + token arm: 10 houses x chair only, the scene-generalization axis. Identical to global_tokens_l1 except for the curriculum, including the 20000-row buffer cap that a 2.8 MB token row forces."
  - "Slowest arm of the ladder at ~254 ms/step, so its step budget is what a common, walltime-achievable budget has to respect."
args:
  adapter: rgb_global_tokens
  curriculum: L3
  output_dir: output/runs/r2dreamer-curriculum-l3-global-tokens/run-${SLURM_JOB_ID}
  wandb_name: l3_global_tokens-s${SEED}-${SLURM_JOB_ID}
  wandb_tags: curriculum,level3,10houses,chair-only,vggt,global-token-transformer,no-gate,rgb-replay,live-cache,bounded-cache,3d-90,jax,3d-encoder
smoke:
  args:
    output_dir: output/smoke/l3-global-tokens-${TIMESTAMP}
    wandb_name: l3-global-tokens-smoke-${TIMESTAMP}
    wandb_tags: global-token-transformer,level3,smoke,no-gate,rgb-replay,live-cache
